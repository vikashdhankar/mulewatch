# Keywords for collect/discover_channels.py. Each one is sent to Telegram's public search
# (contacts.SearchRequest), which returns public channels and groups whose name or username matches.
fraud:
  english:
    - current account kit
    - corporate account
    - savings account sale
    - bank account sell
    - account kit available
    - payout account
    - payin payout
    - gaming payout
    - betting payout
    - rbl account
    - mule account
    - account on rent
    - rent your bank account
    - kyc account
    - sim card sale
    - debit card sale
    - atm card kit
    - net banking kit
    - usdt to inr
    - usdt payout
    - upi account sale
    - merchant account
    - gateway account
    - escrow account india
    - fresh account kit
    - old account sale
  hinglish:
    - khata kiraye par
    - account kiraye pe
    - khata becho
    - account bechna
    - ghar baithe kamai
    - part time job daily payment
    - task job telegram
    - work from home daily income
    - commission per transaction
  hindi:
    - खाता किराये पर
    - बैंक खाता बेचें
    - करंट अकाउंट किट
    - पार्ट टाइम जॉब
