# XLM-R base (Conneau et al. 2020); xlm-roberta-large for a stronger, slower run
name: xlmr
type: hf
seeds: [13, 42, 2026]
params:
  model_name: FacebookAI/xlm-roberta-base
  max_length: 256
  learning_rate: 2.0e-5
  epochs: 5
  batch_size: 16
  eval_batch_size: 64
  grad_accum: 1
  weight_decay: 0.01
  warmup_ratio: 0.1
  class_weighted_loss: true
  early_stopping_patience: 2
  fp16: true
cost:
  hardware: "1x NVIDIA T4 (cloud)"
  usd_per_hour: 0.35        # set to your GPU price
