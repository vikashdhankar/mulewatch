<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 340px; margin: 0; font: 14px/1.45 system-ui, "Segoe UI", sans-serif; color: #172033; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: #121a36; color: #fff; font-weight: 700; }
    main { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
    textarea, input { width: 100%; box-sizing: border-box; border: 1px solid #dde2ec; border-radius: 8px; padding: 8px; font: inherit; }
    button { background: #2b3a9f; color: #fff; border: 0; border-radius: 8px; padding: 9px; font-weight: 600; cursor: pointer; font: inherit; }
    button.ghost { background: #eef0f5; color: #172033; }
    .row { display: flex; gap: 8px; }
    .row button { flex: 1; }
    .res { border-radius: 8px; padding: 10px; background: #f6f7fb; }
    .res b { font-size: 16px; }
    .Critical { border-left: 5px solid #d7263d; } .High { border-left: 5px solid #ea7317; }
    .Medium { border-left: 5px solid #b88a00; } .Low { border-left: 5px solid #3f8f6b; }
    small { color: #5b6478; }
    a { color: #2b3a9f; }
  </style>
</head>
<body>
  <header><img src="icon48.png" width="22" height="22" alt=""> MuleWatch Field Check</header>
  <main>
    <textarea id="text" rows="4" placeholder="Paste a post, or right-click text/images on any page"></textarea>
    <div class="row">
      <button id="check">Check text</button>
      <button id="page" class="ghost">Check selection on page</button>
    </div>
    <div id="out"></div>
    <small>Command center: <input id="api" value="http://localhost:8000"></small>
    <small>Extension key (MW_INGEST_KEY in the command center's .env): <input id="key" type="password" placeholder="paste the key"></small>
  </main>
  <script src="popup.js"></script>
</body>
</html>
